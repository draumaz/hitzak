<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Basque Flag (Ikurrina) background badge -->
  <defs>
    <linearGradient id="flagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009245" />
      <stop offset="100%" stop-color="#006b32" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Mascot Body (Friendly Fox/Creature with Basque Beret / Txapela) -->
  <g filter="url(#shadow)">
    <!-- Body -->
    <circle cx="60" cy="65" r="42" fill="#58cc02" />
    <!-- White Belly -->
    <ellipse cx="60" cy="74" rx="26" ry="24" fill="#ffffff" />
    <!-- Cheeks -->
    <circle cx="34" cy="64" r="7" fill="#ff4b4b" opacity="0.3" />
    <circle cx="86" cy="64" r="7" fill="#ff4b4b" opacity="0.3" />

    <!-- Big Duolingo Eyes -->
    <circle cx="44" cy="54" r="14" fill="#ffffff" />
    <circle cx="76" cy="54" r="14" fill="#ffffff" />
    <circle cx="46" cy="53" r="7" fill="#131f24" />
    <circle cx="74" cy="53" r="7" fill="#131f24" />
    <circle cx="49" cy="50" r="3" fill="#ffffff" />
    <circle cx="77" cy="50" r="3" fill="#ffffff" />

    <!-- Orange Beak/Snout -->
    <path d="M52 62 Q60 68 68 62 Q60 76 52 62 Z" fill="#ff9600" />
    <path d="M53 63 Q60 69 67 63" stroke="#e07e00" stroke-width="1.5" fill="none" />

    <!-- Basque Txapela (Traditional Black Beret) -->
    <!-- Beret Base -->
    <ellipse cx="58" cy="28" rx="38" ry="12" fill="#182c34" transform="rotate(-6 58 28)" />
    <!-- Beret Top Crown -->
    <ellipse cx="58" cy="24" rx="26" ry="10" fill="#2c3e47" transform="rotate(-6 58 24)" />
    <!-- Beret Stem (Txertaka) -->
    <rect x="56" y="14" width="4" height="6" rx="2" fill="#182c34" transform="rotate(-6 58 17)" />

    <!-- Ikurrina Pin on Beret -->
    <circle cx="76" cy="26" r="6" fill="#d52b1e" stroke="#ffffff" stroke-width="1" />
    <path d="M72 26 L80 26 M76 22 L76 30" stroke="#009245" stroke-width="1.8" />
    <path d="M73 23 L79 29 M73 29 L79 23" stroke="#ffffff" stroke-width="1.2" />

    <!-- Feet -->
    <ellipse cx="44" cy="102" rx="10" ry="5" fill="#ff9600" />
    <ellipse cx="76" cy="102" rx="10" ry="5" fill="#ff9600" />
  </g>
</svg>
